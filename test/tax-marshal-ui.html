<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tax Collector / Marshal UI fixture</title>
<link rel="stylesheet" href="../style.css">
<style>body { background: #16282d; } #hud .labels { display: none; }</style>
<div id="hud"></div>
<script type="module">
// Serve the repo and open /test/tax-marshal-ui.html. Add ?tax for collection,
// ?tax&pending for a resumable warranted build, or &lang=de for translations.
// Reload preserves the exact fixture state (including a pending interrupt).
import { createGame, act, viewFor, buildLimit, rankOf } from '../js/engine.js';
import { createUI } from '../js/ui.js';
import { aiAction } from '../js/ai.js';
import { setLang } from '../js/i18n.js';
const params = new URLSearchParams(location.search), cid = params.has('tax') ? 19 : 20;
if (params.has('lang')) setLang(params.get('lang'));
const key = 'tax-marshal-fixture:' + location.search;
let state;
try { state = JSON.parse(sessionStorage.getItem(key)); } catch {}
if (!state) {
  state = createGame({ players: ['You', 'Lady Mira', 'Duke Arven', 'Baron Selt', 'Countess Vael', 'Lord Draven', 'Dame Isolde'].map(name => ({ name })),
    chars: [17, 18, 11, 4, 5, 16, 7, 20, 19], seed: 42 });
  state.deck.push(...state.players.flatMap(p => p.hand));
  state.players.forEach((p, i) => { p.hand = []; p.chars = [i === 0 ? cid : [17, 18, 11, 4, 5, cid === 19 ? 20 : 19][i - 1]]; });
  const give = (pid, id, zone = 'city') => { const i = state.deck.findIndex(c => c.id === id); state.players[pid][zone].push(state.deck.splice(i, 1)[0]); };
  give(0, 'temple'); give(0, 'quarry'); give(0, 'manor', 'hand'); give(0, 'prison', 'hand');
  ['manor', 'keep', 'castle', 'temple', 'stables'].forEach(id => give(1, id));
  ['church', 'tavern'].forEach(id => give(2, id));
  ['watchtower', 'market', 'prison', 'battlefield', 'trading_post', 'docks', 'monastery', 'palace'].forEach(id => give(3, id));
  ['market', 'prison'].forEach(id => give(4, id));
  ['temple', 'church'].forEach(id => give(5, id));
  give(6, 'ivory_tower');
  state.phase = 'turns'; state.call = rankOf(cid);
  state.revealed = state.cfg.chars.filter(c => rankOf(c) <= rankOf(cid) && state.players.some(p => p.chars.includes(c)));
  state.taxPool = 7;
  state.players[0].gold = 3;
  state.turn = { pid: 0, charId: cid, rank: rankOf(cid), income: false, built: 0, paidBuild: false, max: buildLimit(cid), used: {}, pending: null };
  if (params.has('pending')) {
    state.players[1].chars = [18]; state.players[2].chars = [17];
    state.warrants = { pid: 2, targets: [cid, 4, 16], signed: cid, revealed: false };
  }
}
const noop = () => {};
const ui = createUI({ thumbs: {}, mode: () => 'solo', scene: { setInsets: noop, highlight: noop, focus: noop, resetView: noop, screenOf: () => null },
  hint: () => aiAction(viewFor(state, currentSeat()), currentSeat(), { lookahead: false }),
  dispatch(action) {
    const next = act(state, currentSeat(), action);
    if (next.error) return ui.toast(next.error);
    const events = next.ev.filter(e => e.id > state.evSeq);
    state = next; sessionStorage.setItem(key, JSON.stringify(state));
    const view = viewFor(state, currentSeat()); ui.render(view);
    events.forEach(e => ui.event(e, view));
  }, emote: noop, openSettings: noop, again: noop, leave: noop });
function currentSeat() { return state.interrupt?.pid ?? 0; }
ui.show(); ui.render(viewFor(state, currentSeat()));
</script>
</html>
